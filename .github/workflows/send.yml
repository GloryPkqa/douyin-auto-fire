name: Send Douyin Messages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only verify login and friends without sending
        type: boolean
        default: true
  # Enable only after the owner approves, together with STREAK_ENABLED=true.
  # schedule:
  #   - cron: "0 0 * * *"
  #     timezone: "Asia/Shanghai"

concurrency:
  group: douyin-daily-sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check sending approval
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          STREAK_ENABLED: ${{ vars.STREAK_ENABLED }}
        run: |
          if [[ "$DRY_RUN" != "true" && "$STREAK_ENABLED" != "true" ]]; then
            echo "::error::Formal sending is paused pending the owner's approval."
            exit 1
          fi
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Write protected configuration
        env:
          DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
        run: printf '%s' "$DOUYIN_CONFIG" > config.json
      - name: Run
        id: sender
        env:
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          HEADLESS: "true"
          TRACE: "false"
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            python run.py --dry-run
          else
            python run.py
          fi
      - name: Notify Feishu
        if: always()
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          JOB_STATUS: ${{ job.status }}
          SENDER_OUTCOME: ${{ steps.sender.outcome }}
        run: python notify_feishu.py
      # Chat screenshots and traces are intentionally not uploaded.
